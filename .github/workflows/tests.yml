name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      # Only for CI; the tests never talk to a real LLM or Google account.
      JWT_SECRET_KEY: ci-only-secret-key-that-is-long-enough-123456
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            src/requirements*.txt
            src/requirements.lock

      # A clean install from the pinned files: this is what catches a missing or conflicting dependency.
      - name: Install dependencies
        run: pip install -r src/requirements-dev.txt -c src/requirements.lock

      - name: Check the installed packages are consistent
        run: python -m pip check

      - name: Create the settings file from the example
        run: cp src/.env.example src/.env

      - name: Run the backend tests
        run: python -m pytest src/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
