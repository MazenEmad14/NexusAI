services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: mongodb

    ports:
      - "27007:27017"

    volumes:
      - mongo_data_v2:/data/db # 👈 الحل هنا

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - backend

    restart: always

volumes:
  mongo_data_v2:

networks:
  backend:
