[pytest]
# The tests live in src/tests and run against a real MongoDB (they skip themselves when none is reachable).
testpaths = src/tests

# Add src/ to sys.path so all imports resolve
pythonpath = src

addopts = --tb=short --strict-markers -rN

# Suppress noisy third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*
    ignore::UserWarning:langchain.*

log_cli = false
log_level = WARNING
