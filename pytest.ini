[pytest]
# ── NexusAI E2E Test Suite Configuration ───────────────────────────────────
# All tests in the tests/ directory
testpaths = tests

# Add src/ to sys.path so all imports resolve
pythonpath = src

# Verbose output with short traceback for faster debugging
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -rN

# Custom markers to categorise tests
markers =
    e2e: End-to-end integration tests (full graph pipeline)
    auth: Authentication and JWT tests
    hitl: Human-in-the-Loop tests requiring HITL pause/resume
    memory: Conversational memory / LangGraph MemorySaver tests
    schema: Response schema validation tests
    edge: Edge-case robustness tests

# Suppress noisy third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pydantic.*
    ignore::UserWarning:langchain.*

# Log level for captured log output in test failures
log_cli = false
log_level = WARNING
