# Lint: real errors only (syntax, undefined names, unused imports/variables). Formatting is left alone.
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "frontend", "src/stores/llm/templates/locales"]

[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]   # package files re-export names on purpose
